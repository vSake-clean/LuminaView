<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d4a8a"/>
      <stop offset="100%" stop-color="#4a7ac4"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#e8a030"/>
    </linearGradient>
  </defs>

  <!-- rounded frame -->
  <rect x="4" y="4" width="120" height="120" rx="18" ry="18" fill="url(#bg)" stroke="#2a2a3a" stroke-width="2"/>

  <!-- sky -->
  <clipPath id="clip">
    <rect x="12" y="12" width="104" height="104" rx="12" ry="12"/>
  </clipPath>
  <g clip-path="url(#clip)">
    <rect x="12" y="12" width="104" height="104" rx="12" fill="url(#sky)"/>

    <!-- sun -->
    <circle cx="88" cy="36" r="16" fill="url(#sun)" opacity="0.9"/>

    <!-- mountains -->
    <polygon points="12,90 50,42 72,66 90,38 116,80 116,116 12,116" fill="#1e3a5a" opacity="0.7"/>
    <polygon points="12,100 42,60 62,80 84,52 116,90 116,116 12,116" fill="#2a5a3a" opacity="0.8"/>
    <polygon points="12,116 36,76 58,92 76,68 100,86 116,72 116,116" fill="#3a7a4a"/>

    <!-- reflection / water -->
    <rect x="12" y="92" width="104" height="24" fill="#1a3a5a" opacity="0.3"/>
  </g>

  <!-- glossy highlight -->
  <rect x="12" y="12" width="104" height="52" rx="12" fill="white" opacity="0.04"/>
</svg>
